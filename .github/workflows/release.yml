name: Release

# Builds Miniscule (native Xcode app, SwiftTerm for terminal emulation via SPM),
# signs and notarizes it, wraps it in a DMG, and attaches the DMG to a
# GitHub Release. Triggered on demand while the build is still stabilizing —
# switch to `push: { tags: [v*] }` once a run goes green.
#
# NOTE: this does NOT build GhosttyKit.xcframework. Miniscule's Xcode project
# has no dependency on it (it links SwiftTerm via SPM instead) — see the repo's
# bots/ghostty for the vendored Ghostty/Zig source, which isn't wired into the
# app. If Miniscule migrates to GhosttyKit later, a `zig build -Demit-macos-app=false`
# step producing macos/GhosttyKit.xcframework needs to be added back before the
# Xcode build step, and the app target needs to link/embed it.
#
# Required repository secrets for a SIGNED run (Settings > Secrets and
# variables > Actions):
#   CSC_LINK                    - Developer ID Application cert (.p12), base64-encoded
#   CSC_KEY_PASSWORD            - password used when exporting the .p12
#   APPLE_ID                    - Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD - app-specific password (appleid.apple.com > Sign-In and Security)
#   APPLE_TEAM_ID                - 10-character Apple Developer Team ID
#
# If CSC_LINK is not set, the workflow still runs end-to-end as an
# unsigned/ad-hoc build (no keychain import, no notarization, no DMG
# codesign) so a first green build can be verified before signing secrets
# exist.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for this build (e.g. v0.1.0). Defaults to a dev timestamp."
        required: false
        type: string

permissions:
  contents: write

env:
  XCODE_PROJECT: Miniscule.xcodeproj
  XCODE_SCHEME: Miniscule
  APP_NAME: Miniscule

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -switch "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"

      - name: Determine signing mode
        id: signing
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::CSC_LINK is not set — building unsigned/ad-hoc for a smoke test. Set CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID for a real signed+notarized release."
          fi

      - name: Get version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev.$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      # Import Apple signing certificate into a temporary keychain — copied
      # verbatim from DevFlow's release.yml, this part isn't Electron-specific.
      - name: Import signing certificate
        if: steps.signing.outputs.mode == 'signed'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CSC_LINK" | base64 --decode > $RUNNER_TEMP/cert.p12
          if ! openssl pkcs12 -info -in $RUNNER_TEMP/cert.p12 -passin "pass:$CSC_KEY_PASSWORD" -noout -legacy 2>/dev/null && \
             ! openssl pkcs12 -info -in $RUNNER_TEMP/cert.p12 -passin "pass:$CSC_KEY_PASSWORD" -noout 2>/dev/null; then
            echo "::error::Decoded cert.p12 is not readable as PKCS12 with the given CSC_KEY_PASSWORD. CSC_LINK is likely truncated/corrupted (re-copy the base64 without going through a UI paste box) or CSC_KEY_PASSWORD doesn't match the exported .p12."
            exit 1
          fi
          security import $RUNNER_TEMP/cert.p12 -P "$CSC_KEY_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # Surfaces exactly which identities (and team IDs) the imported cert
      # produced in the temp keychain, so a signing failure can be diagnosed
      # as "wrong cert type" / "wrong team" vs. a partition-list/import bug
      # instead of re-guessing from the xcodebuild error alone.
      - name: List available signing identities
        if: steps.signing.outputs.mode == 'signed'
        run: security find-identity -v -p codesigning

      - name: Build signed app
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -derivedDataPath build/dd \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            build

      - name: Build unsigned app (smoke test)
        if: steps.signing.outputs.mode == 'unsigned'
        run: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -derivedDataPath build/dd \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Notarize app
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/dd/Build/Products/Release/${APP_NAME}.app"
          # notarytool needs an archive, so zip the app just for submission.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/${APP_NAME}.zip"
          # submit --wait can exit 0 even when Apple returns "Invalid", so parse
          # the JSON result and fail loudly (with the reject log) unless Accepted.
          RESULT=$(xcrun notarytool submit "$RUNNER_TEMP/${APP_NAME}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)
          echo "$RESULT"
          SUBID=$(echo "$RESULT" | jq -r '.id')
          STATUS=$(echo "$RESULT" | jq -r '.status')
          echo "Notarization submission $SUBID finished with status: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            echo "=== Apple notarization log ==="
            xcrun notarytool log "$SUBID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

      - name: Staple app
        if: steps.signing.outputs.mode == 'signed'
        run: |
          # notarytool reports "Accepted" before the ticket finishes propagating
          # to Apple's CDN, so stapler can briefly get "Record not found". Retry
          # with backoff until the ticket is available.
          APP="build/dd/Build/Products/Release/${APP_NAME}.app"
          for i in $(seq 1 10); do
            if xcrun stapler staple "$APP"; then
              echo "Stapled on attempt $i"
              exit 0
            fi
            echo "Ticket not ready (attempt $i); waiting 30s..."
            sleep 30
          done
          echo "Stapling still failing after retries" >&2
          exit 1

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/dd/Build/Products/Release/${APP_NAME}.app"
          DMG="build/export/${APP_NAME}.dmg"
          mkdir -p build/export
          rm -f "$DMG"
          CODESIGN_ARGS=()
          if [ "${{ steps.signing.outputs.mode }}" = "signed" ]; then
            CODESIGN_ARGS=(--codesign "Developer ID Application")
          fi
          # create-dmg lays out the drag-to-Applications window and signs the image.
          # It can exit non-zero while still producing a valid .dmg (e.g. when it
          # can't apply Finder window styling on the headless runner), so verify
          # the file exists rather than trusting the exit code.
          create-dmg \
            --volname "${APP_NAME}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 150 190 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 450 190 \
            "${CODESIGN_ARGS[@]}" \
            "$DMG" "$APP" || true
          test -f "$DMG"

      - name: Notarize DMG
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "build/export/${APP_NAME}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple DMG
        if: steps.signing.outputs.mode == 'signed'
        run: |
          DMG="build/export/${APP_NAME}.dmg"
          for i in $(seq 1 10); do
            if xcrun stapler staple "$DMG"; then
              echo "Stapled on attempt $i"
              exit 0
            fi
            echo "Ticket not ready (attempt $i); waiting 30s..."
            sleep 30
          done
          echo "Stapling still failing after retries" >&2
          exit 1

      - name: Create release and attach DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$VERSION" --jq '.body' 2>/dev/null || echo "")
          gh release create "$VERSION" \
            --title "${APP_NAME} ${VERSION}" \
            --notes "$NOTES" \
            --prerelease \
            "build/export/${APP_NAME}.dmg"
